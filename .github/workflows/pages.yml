name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one Pages deployment at a time — queue rather than run concurrently,
# so a rapid run of pushes (e.g. utxo-trace's CI landing several commits in
# a row) can't have two deployments racing against the same environment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # docs/ is already Hugo's fully-built output (publishDir="docs" in
      # config.toml) — nothing to build here, just publish what's committed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
